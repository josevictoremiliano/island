<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ilha</title>
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="notch">
  <div id="island" class="collapsed">
    <div id="bar"></div>
    <div id="line" title="Clique para abrir a ilha"></div>
    <div id="panel">
      <header class="phead">
        <div class="when"><span id="pDate"></span><b id="pTime"></b></div>
        <nav id="tabs">
          <button data-tab="ai" class="on" title="IA"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/></svg></button>
          <button data-tab="music" title="Música"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
          <button data-tab="shelf" title="Bandeja de arquivos"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><i class="count" id="shelfCount"></i></button>
          <button data-tab="clips" title="Área de transferência"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
          <button data-tab="timer" title="Timer de foco"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg></button>
          <button data-tab="cal" title="Agenda"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
          <button data-tab="note" title="Nota rápida"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
        </nav>
        <div class="pright">
        <div class="links" id="links"></div>
        <div class="tools">
          <button id="netBtn" data-tab="net" title="Wi‑Fi e Bluetooth"></button>
          <button id="pin" title="Fixar aberta (atalho)"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 4 3v2H6v-2l4-3z"/></svg></button>
          <button id="gear" title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div>
        </div>
      </header>

      <div class="guard" id="guard" hidden></div>

      <section id="tab-ai" class="tab on"></section>

      <section id="tab-music" class="tab">
        <div class="player" id="player">
          <div class="art" id="mArt"></div>
          <div class="meta">
            <b id="mTitle"></b>
            <span id="mArtist"></span>
            <div class="prog"><span id="mPos">0:00</span><div class="bar"><i id="mBar"></i></div><span id="mDur">0:00</span></div>
          </div>
          <div class="ctl">
            <button data-media="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8zM5 19V5"/></svg></button>
            <button data-media="toggle" class="big" id="mToggle" title="Tocar / pausar"></button>
            <button data-media="next" title="Próxima"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
          </div>
        </div>
        <div class="lyrics" id="lyrics"></div>
        <div class="empty" id="mEmpty"><b>Nada tocando</b>Dê play no Spotify, no navegador ou em qualquer player.</div>
      </section>

      <section id="tab-shelf" class="tab">
        <div id="shelfList"></div>
      </section>

      <section id="tab-clips" class="tab">
        <div id="clipList"></div>
      </section>

      <section id="tab-cal" class="tab">
        <div id="calList"></div>
      </section>

      <section id="tab-net" class="tab">
        <div id="netBox"></div>
      </section>

      <section id="tab-timer" class="tab">
        <div class="timer">
          <div id="tDisplay">25:00</div>
          <div class="presets">
            <button data-min="5">5</button><button data-min="15">15</button><button data-min="25" class="on">25</button><button data-min="50">50</button>
          </div>
          <div class="tbtns">
            <button id="tStart" class="primary">Iniciar</button>
            <button id="tReset">Zerar</button>
          </div>
        </div>
      </section>

      <section id="tab-note" class="tab">
        <textarea id="note" placeholder="Uma nota rápida, sempre à mão…" spellcheck="false"></textarea>
      </section>

      <footer id="usage"></footer>
      <div id="sys"></div>
    </div>
  </div>
  </div>
  <div id="notices"></div>
  <div id="toast"></div>
  <script src="sounds.js"></script>
  <script src="island.js"></script>
</body>
</html>
